version: '3.8'
services:
  database:
    image: postgres:latest
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5422:5432"

  wallet-app:
    image: wallet-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: "jdbc:postgresql://database:5432/db"
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: password
